# uncrustify.cfg -- NASA SEL-94-003 "C Style Guide" (Aug 1994) for apollo-c.
#
# Written for and verified with Uncrustify 0.72.0 (`uncrustify --version`
# prints Uncrustify-0.72.0_f).  It replaced .clang-format (clang-format 14),
# which is kept in git history.  Uncrustify runs inside tools/format.sh,
# between two passes of tools/fix_comments.py, which does what 0.72 cannot:
# comments out of expressions, joining wraps, paragraph blank lines and
# paragraph-scoped column alignment.  Every option below cites the guide
# section it encodes; history/STYLE.md has the full rule table and
# history/waves/style2.md, history/waves/format2.md the validation records.
#
#   make format        rewrite src include tests in place (tools/format.sh)
#   make format-check  fail if any file would change
#
# Options not listed keep Uncrustify's defaults.  170 options are set
# below, plus one `file_ext` line; each `name = value` line is deliberate.

# ---------------------------------------------------------------------------
# Language and token safety: the formatter changes white space only.
# ---------------------------------------------------------------------------

# Parse .h as C, not C++ (the default for .h).  In C++ mode `in` is a
# keyword, and `agc_orbit_params_in_t *in` was spaced as a multiplication.
file_ext C .c .h

newlines                        = lf
utf8_force                      = false
utf8_bom                        = ignore
tok_split_gte                   = false
string_replace_tab_chars        = false
cmt_convert_tab_to_spaces       = false
# No token is added, removed or reordered: braces, parentheses, semicolons,
# casts and `return`/`sizeof` parentheses stay as written (7.1.2 brace and
# return-paren choices are review / tools/check_style.py items).
mod_full_brace_do               = ignore
mod_full_brace_for              = ignore
mod_full_brace_function         = ignore
mod_full_brace_if               = ignore
mod_full_brace_while            = ignore
mod_full_brace_if_chain         = false
mod_full_paren_if_bool          = false
mod_paren_on_return             = add     # 7.1.2 parentheses around the object of return
mod_remove_extra_semicolon      = false
mod_remove_empty_return         = false
mod_move_case_break             = false
mod_case_brace                  = ignore
mod_enum_last_comma             = ignore
mod_add_long_function_closebrace_comment = 0
mod_add_long_switch_closebrace_comment   = 0
mod_add_long_ifdef_endif_comment         = 0
mod_add_long_ifdef_else_comment          = 0
# Comments: never reflowed, re-wrapped or re-starred (2.3: boxed prologs and
# the AGC's own comment layouts are kept as written).
cmt_width                       = 0
cmt_reflow_mode                 = 0
cmt_star_cont                   = false
cmt_c_group                     = false
cmt_cpp_to_c                    = false
# Re-indent continuation lines of a moved block comment with it, but do
# not strip their leading space when the first and last lines are the same
# length (that is every right-padded `... */` comment in the tree).
cmt_indent_multi                = true
cmt_multi_check_last            = false

# ---------------------------------------------------------------------------
# 2.2.3 indentation: four spaces, never tabs.
# ---------------------------------------------------------------------------
input_tab_size                  = 4
output_tab_size                 = 4
indent_columns                  = 4
indent_with_tabs                = 0
indent_brace                    = 0
indent_braces                   = false
# 2.3: comments are indented with the code they describe, including those
# that happen to start in column 1.
indent_col1_comment             = true
# 4.4: preprocessor directives stay in column 1.
pp_indent                       = remove
pp_space                        = remove

# ---------------------------------------------------------------------------
# Line length and wrapping (user direction 2026-10-11; the guide sets no
# limit).  No column limit, one statement per line: Uncrustify never wraps.
# The one allowed wrap -- the outermost call of a statement with its
# arguments one per line -- keeps its line breaks and each argument is
# aligned under the first (after the open parenthesis).  Every other wrap
# is joined back onto one line by tools/fix_comments.py, which `make
# format` runs before and after Uncrustify.
# ---------------------------------------------------------------------------
code_width                      = 0
ls_code_width                   = false
indent_align_paren              = true
indent_align_assign             = true
indent_func_call_param          = false
indent_paren_nl                 = false
indent_paren_close              = 0
indent_continue                 = 0
nl_func_call_start              = ignore
nl_func_call_args               = ignore
nl_func_call_end                = ignore
nl_func_decl_args               = ignore
nl_func_def_args                = ignore
# 6.7: where a line is broken by hand (the one allowed wrap), an operator
# or comma stays at the end of the line.
pos_bool                        = trail
pos_conditional                 = trail
pos_arith                       = trail
pos_comma                       = trail
ls_func_split_full              = false

# ---------------------------------------------------------------------------
# 7.1.2 Braces-Stand-Alone everywhere: each brace on its own line, aligned
# with the statement that opens the block.  7.2.3 `else if` on one line;
# 7.3.3 the `while` of a do-while on its own line after the `}`.
# ---------------------------------------------------------------------------
nl_fdef_brace                   = force
nl_if_brace                     = force
nl_elseif_brace                 = force
nl_else_brace                   = force
nl_brace_else                   = force
nl_else_if                      = remove
nl_for_brace                    = force
nl_while_brace                  = force
nl_do_brace                     = force
nl_brace_while                  = force
nl_switch_brace                 = force
nl_enum_brace                   = force
nl_struct_brace                 = force
nl_union_brace                  = force
# 7.2.5: a braced case body puts `{` on the line after the label.
nl_case_colon_brace             = force
# 5.2: the return type stays on the function name's line.
nl_func_type_name               = remove
nl_func_proto_type_name         = remove
# 6.2.3: one enumerator per line.
nl_enum_own_lines               = force
nl_enum_leave_one_liners        = false

# ---------------------------------------------------------------------------
# 7.1.1 one statement per line; 7.2.1 / 7.3.x a single controlled statement
# goes on its own line, indented one level (never `if (x) y;`).
# ---------------------------------------------------------------------------
nl_after_semicolon              = true
nl_after_vbrace_open            = true
nl_after_case                   = true
nl_if_leave_one_liners          = false
nl_func_leave_one_liners        = false
nl_split_if_one_liner           = true
nl_split_for_one_liner          = true
nl_split_while_one_liner        = true
nl_create_if_one_liner          = false

# ---------------------------------------------------------------------------
# 7.2.5 switch: `case` one level inside the switch braces, statements one
# level further; a case-body brace sits under the `c` of `case`.
# ---------------------------------------------------------------------------
indent_switch_case              = 4
indent_case_brace               = 0
sp_before_case_colon            = remove

# ---------------------------------------------------------------------------
# 2.2.2 / 6.7 / 7.1.2 spacing.
# ---------------------------------------------------------------------------
# Space around binary, assignment, relational, logical and ?: operators.
sp_arith                        = force
sp_assign                       = force
sp_enum_assign                  = force
sp_compare                      = force
sp_bool                         = force
sp_cond_colon                   = force
sp_cond_question                = force
# One space after a comma, none before; `for (a; b; c)`.
sp_after_comma                  = force
sp_before_comma                 = remove
sp_before_semi                  = remove
sp_before_semi_for              = remove
sp_after_semi_for               = force
# No space around `->` `.` `[ ]`; unary operators hug their operand (`!p`).
sp_member                       = remove
sp_before_square                = remove
sp_inside_square                = remove
sp_not                          = remove
sp_inv                          = remove
sp_addr                         = remove
sp_deref                        = remove
sp_sign                         = remove
sp_incdec                       = remove
# Casts are the exception: `(long) m`.
sp_after_cast                   = force
sp_inside_paren_cast            = remove
# No space before a call's or definition's `(` and none inside parentheses.
sp_func_call_paren              = remove
sp_func_call_paren_empty        = remove
sp_func_def_paren               = remove
sp_func_proto_paren             = remove
sp_inside_fparen                = remove
sp_inside_fparens               = remove
sp_inside_paren                 = remove
sp_paren_paren                  = remove
# 7.1.2: a space between a reserved word and its `(`: `if (`, `for (`,
# `while (`, `switch (`, `return (x)`, `sizeof (x)`.
sp_before_sparen                = force
sp_inside_sparen                = remove
sp_return_paren                 = force
sp_sizeof_paren                 = force
sp_else_brace                   = force
sp_brace_else                   = force
# 6.5: the pointer `*` goes with the name: `char *s`.
sp_before_ptr_star              = force
sp_after_ptr_star               = remove
sp_between_ptr_star             = remove

# ---------------------------------------------------------------------------
# Alignment (5.4 / 6.2 / 6.2.3 / 2.3).  A span of 1 aligns consecutive lines
# only; a blank line ends the group.  Uncrustify 0.72 has no column-limit
# test for alignment (clang-format split a group that would pass column
# 80); see the trailing-comment note below.
# ---------------------------------------------------------------------------
# 5.4 / 6.2 (user direction 2026-10-11): within a paragraph (consecutive
# non-blank lines) one-line statements line up as columns -- declaration
# type | name | `=` | expression | trailing comment.  Uncrustify 0.72
# counts an alignment span in lines and does not stop at a blank line (a
# span of 1 stops at any line that is not a declaration/assignment, which
# splits a paragraph), so tools/fix_comments.py does this alignment after
# Uncrustify; the spans here are 0 so that Uncrustify leaves single spaces
# for it to work from.
align_var_def_span              = 0
align_var_def_star_style        = 2
align_var_struct_span           = 0
# One-parameter-per-line definitions: names of the parameters aligned.
align_func_params               = true
align_func_params_span          = 1
# 5.4 applied to declarations generally (clang-format aligned consecutive
# prototypes too): function names of consecutive prototypes in one column.
align_func_proto_span           = 1
sp_type_func                    = force
# 6.2 / 6.2.3: enum values and #define values aligned (consecutive lines);
# assignments and declarations: see above.
align_assign_span               = 0
align_enum_equ_span             = 1
align_pp_define_span            = 1
align_nl_cont                   = true
# 2.3 (user direction 2026-10-11): within a paragraph the trailing comments
# at one brace level start in one column, one space past the longest code
# line of the paragraph; a comment after `{` is not aligned with them.
# Done by tools/fix_comments.py for the reason above (span 0 here).
align_right_cmt_span            = 0
align_right_cmt_gap             = 1
align_right_cmt_same_level      = true
align_right_cmt_mix             = false
align_right_cmt_at_col          = 0
sp_before_tr_emb_cmt            = add
sp_num_before_tr_emb_cmt        = 1

# ---------------------------------------------------------------------------
# 4.3 includes: sorted case-sensitively within each blank-line-separated
# block, <system> before "project" inside a block.  The blocks themselves
# are kept: <stdio.h>/<stdlib.h> first, other system headers, then project
# headers is the author's job (uncrustify cannot rank stdio/stdlib first;
# grouping_enabled would merge the blocks and sort <stdio.h> after
# <math.h>, so it stays off).
# ---------------------------------------------------------------------------
mod_sort_include                = true
mod_sort_case_sensitive         = true
mod_sort_incl_import_prioritize_angle_over_quotes = true
mod_sort_incl_import_grouping_enabled             = false

# ---------------------------------------------------------------------------
# 2.2.1 / 5.5 / 7 blank lines and statement paragraphing.
# ---------------------------------------------------------------------------
# One blank line separates program parts, never more; none just inside a
# brace.
nl_max                          = 2
nl_max_blank_in_func            = 2
eat_blanks_after_open_brace     = true
eat_blanks_before_close_brace   = true
nl_end_of_file                  = force
nl_end_of_file_min              = 1
# 4.6: functions are separated by a blank line (the prolog follows it).
nl_after_func_body              = 2
# 5.4 / 5.5: a blank line after the block of declarations at the top of a
# function body (tools/fix_comments.py).  Uncrustify 0.72 would also put
# one after every later run of declarations, which splits paragraphs such
# as `agc_dp_t th = ...; th = ...;` that the user writes as one (user
# reference calcthet, 2026-10-11), so both options are 0.
nl_func_var_def_blk             = 0
nl_var_def_blk_end              = 0
# 5.5 / 7: a control statement is its own paragraph.  Blank line before
# `if`/`for`/`while`/`do`/`switch` when a statement precedes it (a leading
# comment stays attached: the blank goes above the comment; nothing is
# added after `{`), and after the block when a statement follows (nothing
# before `}`, nothing between `}` and `else`).
nl_before_if                    = add
nl_after_if                     = add
nl_before_for                   = add
nl_after_for                    = add
nl_before_while                 = add
nl_after_while                  = add
nl_before_do                    = add
nl_after_do                     = add
nl_before_switch                = add
nl_after_switch                 = add
# 5.6: `return` starts its own paragraph unless it opens the block or
# directly follows a `case` label.
nl_before_return                = true
# 2.2.1 (user direction 2026-10-11): a standalone comment that introduces
# a group of statements or declarations begins a paragraph, so a blank
# line precedes it (file scope and functions alike); none is added after
# `{` or between two comment lines.  tools/fix_comments.py applies it
# (after a line ending in `;`, `}`, a table row's `,`, or a preprocessor
# line).  Uncrustify's nl_before_block_comment / nl_before_c_comment = 2
# cannot be used: they skip a comment that follows a trailing comment, and
# they insert a blank between two comments (a section banner and the
# function prolog under it, or a block comment and the next comment line).
nl_before_block_comment         = 0
nl_before_c_comment             = 0
# Keep `#if` / `#endif` hugging the code they guard.
nl_squeeze_ifdef                = true
